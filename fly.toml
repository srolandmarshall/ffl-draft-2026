# fly.toml app configuration file generated for ffl-draft on 2026-08-24T20:28:36-04:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'ffl-draft'
primary_region = 'ewr'
console_command = '/rails/bin/rails console'

[build]
[env]
  APP_HOST = 'draft.sammarshall.us'
  HTTP_PORT = '8080'
  SOLID_QUEUE_IN_PUMA = 'true'
  # Solid Queue shares this process, and image requests that still fall back to the Active
  # Storage proxy hold a thread while they stream from S3.
  RAILS_MAX_THREADS = '5'

[[mounts]]
  source = 'data'
  destination = '/rails/storage'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = '10s'
    timeout = '5s'
    grace_period = '30s'
    method = 'GET'
    path = '/up'
    protocol = 'http'
    tls_skip_verify = false

    [http_service.checks.headers]
      X-Forwarded-Proto = 'https'

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
