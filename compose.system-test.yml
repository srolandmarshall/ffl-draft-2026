services:
  test:
    build:
      context: .
      dockerfile: Dockerfile.system-test
    command: bin/rails db:test:prepare test:system
    depends_on:
      selenium:
        condition: service_healthy
    environment:
      CAPYBARA_SERVER_HOST: test
      DRAFT_SIMULATION_ROUNDS: ${DRAFT_SIMULATION_ROUNDS:-16}
      DRAFT_SIMULATION_TEAM_COUNT: ${DRAFT_SIMULATION_TEAM_COUNT:-12}
      RAILS_ENV: test
      SELENIUM_REMOTE_URL: http://selenium:4444/wd/hub

  selenium:
    image: selenium/standalone-chrome:4.47.0-20260808
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://localhost:4444/wd/hub/status"]
      interval: 5s
      timeout: 3s
      retries: 12
    shm_size: 2gb
